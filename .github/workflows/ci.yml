name: CI

on:
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest tests/

      - name: Pull DVC data
        run: uv run dvc pull

      - name: Data checks
        run: |
          test -f data/raw/train.csv
          test -f data/raw/test.csv
          echo "DVC data files exist"

      - name: Smoke training
        run: uv run dvc repro
