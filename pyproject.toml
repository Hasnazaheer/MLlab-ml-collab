[project]
name = "mllab-ml-collab"
version = "0.1.0"
description = "Titanic survival classifier with a reproducible ML pipeline"
readme = "README.md"
authors = [
    { name = "zohaib-zayg", email = "zohaib@zayg.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "dvc>=3.67.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "notebook>=7.6.3",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
